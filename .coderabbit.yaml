# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
#
# Why this file exists: CodeRabbit reviews are rate-limited PER DEVELOPER on a rolling
# hourly window (Pro 5/hr, Pro+ 10/hr), and every run counts against it — including the
# automatic re-review after each push. On 2026-08-24 one ticket's worth of work (PRs
# #33-#35, five pushes) exhausted the allowance and left #35 unreviewed for over an hour.
#
# auto_incremental_review: false makes re-review a deliberate act. The first review of a
# PR is still automatic; each later round is requested with `@coderabbitai review`. That
# matches the fix -> push -> re-review loop in AGENTS.md without spending a review on
# every intermediate commit. `@coderabbitai rate limit` reports remaining capacity and
# does not consume a review.
#
# Two facts learned after this file shipped (verified on dotfiles #171, the PR that added it
# there, 2026-08-24):
#   * The config is read from the PR HEAD branch, not the base — so a PR introducing or changing
#     this file governs itself immediately, before it merges.
#   * A suppressed round shows up as a PASSING check reading
#     "Review skipped: incremental reviews are disabled". That is a third clean-looking state
#     alongside "Review in progress" and "Review rate limited" — all three pass while no review
#     has run. Never read a green CodeRabbit check as an approval; check the review verdict.
reviews:
  auto_review:
    auto_incremental_review: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
