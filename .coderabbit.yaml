# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit is not this repo's review gate; MergeWren is (AGENTS.md, since 2026-11-03).
# Reviews here are manual-only: `auto_review.enabled: false` turns off the first automatic
# review and `auto_incremental_review: false` the re-review on push, so nothing here spends the
# per-developer quota that other repos still use. A review runs only if someone comments
# `@coderabbitai review`, which AGENTS.md says not to do.
#
# CodeRabbit reads this file from the PR head branch, so a PR that changes it governs itself
# before it merges (verified on dotfiles #171, 2026-08-24). If a CodeRabbit check appears, a
# passing one doesn't mean a review ran: only the description `Review completed` does.
reviews:
  auto_review:
    enabled: false
    auto_incremental_review: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
