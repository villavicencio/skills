name: validate

on:
  pull_request:
  push:
    branches: [main]
    # Release tags (`<plugin>--vX.Y.Z`) also run the structure gate, and are the
    # cadence at which the paid behavioral-evals job runs — see that job's `if:`.
    tags: ["*--v*"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyPI package `skills-ref` installs the binary `agentskills` (NOT `skills-ref`).
      # The same-named npm package is by a different author and is explicitly demo-only;
      # do not substitute. See repo README + risks section in the original plan.
      - name: Install agentskills (skills-ref 0.1.1)
        run: pip install 'skills-ref==0.1.1'

      # Per-skill spec validation across every plugin's skills/ tree.
      # Empty plugins/ is a no-op pass.
      - name: Validate every skill
        run: |
          set -e
          shopt -s nullglob
          skill_dirs=(plugins/*/skills/*/)
          if [ ${#skill_dirs[@]} -eq 0 ]; then
            echo "No skill directories under plugins/*/skills/ — nothing to validate."
            exit 0
          fi
          rc=0
          for dir in "${skill_dirs[@]}"; do
            echo "::group::Validating ${dir}"
            agentskills validate "${dir%/}" || rc=$?
            echo "::endgroup::"
          done
          exit $rc

      # Per-plugin version-parity: every skill inside a single plugin's skills/
      # tree must share the same metadata.version. Plugins release at the plugin
      # grain, so any per-skill version drift inside a plugin breaks the contract.
      - name: Enforce per-plugin skill version-parity
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          from collections import defaultdict
          from pathlib import Path

          groups = defaultdict(set)
          for plugin_dir in sorted(Path("plugins").iterdir()):
              if not plugin_dir.is_dir():
                  continue
              skills_root = plugin_dir / "skills"
              if not skills_root.is_dir():
                  continue
              for skill_dir in sorted(skills_root.iterdir()):
                  if not skill_dir.is_dir():
                      continue
                  if not (skill_dir / "SKILL.md").exists():
                      continue
                  props = json.loads(subprocess.check_output(
                      ["agentskills", "read-properties", str(skill_dir)]
                  ))
                  meta = props.get("metadata") or {}
                  version = meta.get("version")
                  groups[plugin_dir.name].add((skill_dir.name, version))

          failed = False
          for plugin_name, members in groups.items():
              versions = {v for _, v in members}
              if len(versions) > 1:
                  failed = True
                  detail = ", ".join(f"{name}={ver}" for name, ver in sorted(members))
                  print(f"::error::Plugin '{plugin_name}' has skill-version drift: {detail}")
              else:
                  v = next(iter(versions))
                  names = ", ".join(sorted(name for name, _ in members))
                  print(f"OK — plugin '{plugin_name}' skills @ {v} ({names})")

          sys.exit(1 if failed else 0)
          PY

      # Each plugin.json's `version` field must match the skill versions inside
      # that plugin. Without this, plugin tag + skill metadata can drift apart.
      - name: Enforce plugin.json ↔ skill version-parity
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          failed = False
          for plugin_dir in sorted(Path("plugins").iterdir()):
              if not plugin_dir.is_dir():
                  continue
              manifest = plugin_dir / ".claude-plugin" / "plugin.json"
              if not manifest.exists():
                  print(f"::error::Plugin '{plugin_dir.name}' missing .claude-plugin/plugin.json")
                  failed = True
                  continue
              plugin_version = json.load(open(manifest)).get("version")
              skills_root = plugin_dir / "skills"
              if not skills_root.is_dir():
                  continue
              for skill_dir in sorted(skills_root.iterdir()):
                  if not (skill_dir / "SKILL.md").exists():
                      continue
                  props = json.loads(subprocess.check_output(
                      ["agentskills", "read-properties", str(skill_dir)]
                  ))
                  skill_version = (props.get("metadata") or {}).get("version")
                  if skill_version != plugin_version:
                      failed = True
                      print(
                          f"::error::Plugin '{plugin_dir.name}' plugin.json version "
                          f"{plugin_version!r} != skill '{skill_dir.name}' "
                          f"metadata.version {skill_version!r}"
                      )
                  else:
                      print(f"OK — {plugin_dir.name}/{skill_dir.name} @ {skill_version}")

          sys.exit(1 if failed else 0)
          PY

      # Unit-tests the eval harness's own logic. Stdlib only — no install, no
      # API key, no network — so unlike the paid behavioral job below these run
      # on EVERY push and PR. They exist because check_assertions shipped an
      # any-of/all-of semantics bug that survived undetected for precisely one
      # reason: no CI path ever executed that function.
      #
      # Globbed so adding tooling/evals/test_*.py needs no workflow edit, the
      # same way fixtures are picked up automatically.
      - name: Unit-test eval harness logic
        run: |
          set -e
          shopt -s nullglob
          tests=(tooling/evals/test_*.py)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error::No tooling/evals/test_*.py found — the harness unit tests have gone missing."
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "::group::${t}"
            python3 "${t}"
            echo "::endgroup::"
          done

  # Behavioral layer: does each skill actually trigger when it should, and does
  # loading it change behavior in the intended direction? See tooling/evals/README.md
  # for the methodology.
  #
  # TWO independent gates, because this job costs real money — it makes ~540 live
  # Sonnet calls (9 skills x 20 queries x 3 samples), roughly $1.50-2.00 a run:
  #
  #   1. CADENCE (the `if:` below) — release tags and manual dispatch only, NOT
  #      every push and PR. A broken skill description ships at tag time, so that
  #      is where the signal is worth paying for. Run it mid-cycle from the
  #      Actions tab ("Run workflow") whenever you have edited a description.
  #   2. KEY PRESENCE (the per-step `if:`s) — without an ANTHROPIC_API_KEY repo
  #      secret every real step skips and the job stays green, so forks and
  #      key-less runs are unaffected.
  #
  # The `validate` job above remains the always-on hard gate on every push and PR.
  behavioral-evals:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Note when behavioral evals are skipped
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: echo "::notice::ANTHROPIC_API_KEY not configured — skipping behavioral evals (structure validation still gates)."

      - name: Install uv
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        uses: astral-sh/setup-uv@v5

      # uv resolves each runner's inline PEP 723 dependencies on the fly.
      - name: Run trigger + output evals for every skill with fixtures
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: |
          set -e
          shopt -s nullglob
          rc=0

          for trig in plugins/*/skills/*/evals/triggers.json; do
            skill_dir=$(dirname "$(dirname "$trig")")          # plugins/<p>/skills/<s>
            skill=$(basename "$skill_dir")
            plugin_root=$(dirname "$(dirname "$skill_dir")")   # plugins/<p>
            echo "::group::trigger evals — ${plugin_root}/${skill}"
            uv run tooling/evals/run_trigger_evals.py "$skill" --plugin-root "$plugin_root" || rc=$?
            echo "::endgroup::"
          done

          for ev in plugins/*/skills/*/evals/evals.json; do
            skill_dir=$(dirname "$(dirname "$ev")")
            skill=$(basename "$skill_dir")
            plugin_root=$(dirname "$(dirname "$skill_dir")")
            echo "::group::output evals — ${plugin_root}/${skill}"
            uv run tooling/evals/run_output_evals.py "$skill" --plugin-root "$plugin_root" || rc=$?
            echo "::endgroup::"
          done

          exit $rc
